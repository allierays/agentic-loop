# Pre-commit hooks for agentic-loop development
# We eat our own dog food

repos:
  - repo: local
    hooks:
      - id: vibe-check
        name: Vibe Check
        entry: node bin/vibe-check.js --exclude 'src/checks/**,src/utils/patterns.ts' --fail-on error
        language: node
        types_or: [javascript, ts, python, json]
        pass_filenames: true

      - id: typecheck
        name: TypeScript typecheck
        entry: npx tsc --noEmit
        language: node
        pass_filenames: false
        files: '\.(ts|tsx)$'

  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.txt$'
      - id: end-of-file-fixer
        exclude: '\.txt$'
      - id: check-yaml
        exclude: '\.pre-commit-hooks\.yaml$'
      - id: check-added-large-files
