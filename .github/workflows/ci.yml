name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vibe Check
        run: node bin/vibe-check.js --fail-on error src/

  bash-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check unused bash functions
        run: ./scripts/check-unused-bash-functions.sh

      - name: Bash syntax check
        run: |
          failed=0
          for f in ralph/*.sh ralph/verify/*.sh; do
            if ! bash -n "$f"; then
              echo "Syntax error in $f"
              failed=1
            fi
          done
          exit $failed
