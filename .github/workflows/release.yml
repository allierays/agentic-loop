name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - uses: actions/setup-node@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: steps.check_tag.outputs.exists == 'false'

      - run: npm run build
        if: steps.check_tag.outputs.exists == 'false'

      - run: npm publish --provenance --access public
        if: steps.check_tag.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build release notes
        if: steps.check_tag.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          # Find the previous tag to diff against
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$VERSION" | head -1)

          # Build title from feat/fix commits (skip chore/ci)
          TITLE=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" \
            | grep -E "^(feat|fix):" \
            | head -1 \
            | sed 's/^(feat|fix): //')

          # Fall back to version if no feat/fix commits
          if [[ -z "$TITLE" ]]; then
            TITLE="$VERSION"
          else
            TITLE="$VERSION — $TITLE"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # Build body from all non-chore commits
          {
            echo "## Changes"
            echo ""
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" \
              | grep -vE "^- chore:" || true
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "${{ steps.notes.outputs.title }}" \
            --notes-file /tmp/release-notes.md

      - name: Skip message
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Tag v${{ steps.version.outputs.version }} already exists, skipping publish"
